<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dwak — Trouvez votre médicament en Algérie</title>
  <meta name="description" content="Dwak (دواك) : quelle pharmacie près de chez vous a votre médicament, maintenant. Disponibilité vérifiée, génériques équivalents, pharmacies de garde, alertes de retour en stock. Alger, Oran, Constantine.">
  <meta name="theme-color" content="#2d5940">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Dwak — Trouvez votre médicament">
  <meta property="og:description" content="42% des Algériens font 3 pharmacies ou plus pour trouver un médicament. Dwak vous dit directement laquelle l'a en stock.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="frame">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="latin">Dwak</span>
        <span class="arabic">دواك</span>
      </div>
      <button id="lang-btn" class="lang-btn">العربية</button>
    </div>
    <p class="tagline" id="tagline">Trouvez votre médicament, tout de suite.</p>
  </header>

  <main>
    <!-- Chercher -->
    <section class="view active" id="view-search">
      <div class="search-wrap">
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="">
        </div>
        <p class="search-hint" id="search-hint"></p>
        <div class="suggest" id="suggest"></div>
      </div>

      <div class="loc-bar">
        <span id="loc-label"></span>
        <div class="city-select" id="city-select"></div>
      </div>

      <div class="install-banner" id="install-banner">
        <span id="install-label">Installer l’application</span>
        <button id="install-btn">OK</button>
      </div>

      <div class="bulletin" id="bulletin"></div>

      <div class="section recents" id="recents"></div>

      <p class="legal" id="legal-search"></p>
    </section>

    <!-- Résultats -->
    <section class="view" id="view-results">
      <div id="results-inner"></div>
    </section>

    <!-- Garde -->
    <section class="view" id="view-garde">
      <div id="garde-inner"></div>
    </section>

    <!-- Alertes -->
    <section class="view" id="view-alerts">
      <div id="alerts-inner"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Navigation">
    <button data-view="search" id="tab-search" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Chercher</span>
    </button>
    <button data-view="garde" id="tab-garde" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <span>Garde</span>
    </button>
    <button data-view="alerts" id="tab-alerts" class="badge-dot" data-n="0" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span>Alertes</span>
    </button>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
